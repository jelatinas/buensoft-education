
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buensoft Education - Plataforma de Aprendizaje</title>
    <style>
      body {
        font-family: 'Fredoka', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .dark body {
        background-color: #0c0a21;
      }
      * {
        transition-property: background-color, border-color, color, fill, stroke;
        transition-duration: 200ms;
      }
      .prose h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; }
      .prose h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.75rem; }
      .prose p { margin-bottom: 0.5rem; }
      .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.875rem; }
      .prose th, .prose td { border: 1px solid #e2e8f0; padding: 0.5rem; text-align: left; }
      .prose th { background-color: #f8fafc; font-weight: bold; }
      .dark .prose th { background-color: #1e1b4b; border-color: #312e81; }
      .dark .prose td { border-color: #312e81; }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #6366f1;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.1);
      }
      .dark .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #4f46e5;
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .float-animation { animation: float 3s ease-in-out infinite; }
      
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 3s linear infinite;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1?deps=react@19.0.0",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0",
    "rehype-raw": "https://esm.sh/rehype-raw@7.0.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-sky-50 dark:bg-indigo-950">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
